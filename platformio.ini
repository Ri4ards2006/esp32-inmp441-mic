; PlatformIO Project Configuration File
; ESP32-WROOM-32D + INMP441 I2S Digital MEMS Microphone

[platformio]
default_envs = esp32dev
description = Modular ESP32 I2S audio acquisition firmware for INMP441 MEMS microphone

; ---------------------------------------------------------------------------
; Shared ESP32 settings
; ---------------------------------------------------------------------------
[esp32_common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    default
    time
upload_speed = 921600
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -O3
    -Wno-unused-variable
    -Wno-unused-but-set-variable

; ---------------------------------------------------------------------------
; Default: capture -> process -> transport pipeline (builds from a clean clone)
; ---------------------------------------------------------------------------
[env:esp32dev]
extends = esp32_common
build_src_filter = +<*> -<app_kws.cpp>
lib_ignore = edge-impulse-sdk
build_flags =
    ${esp32_common.build_flags}
    -DMIC_SAMPLE_RATE=16000

; ---------------------------------------------------------------------------
; Opt-in: Edge Impulse keyword spotter ("hello"). Needs the exported SDK in
; lib/edge-impulse-sdk/ (gitignored, not in the repo). Build: pio run -e esp32dev-kws
; ---------------------------------------------------------------------------
[env:esp32dev-kws]
extends = esp32_common
build_src_filter = +<*> -<app_pipeline.cpp> -<pipeline/>
lib_ldf_mode = deep+
lib_deps =
    edge-impulse-sdk
build_flags =
    ${esp32_common.build_flags}
    -DMIC_SAMPLE_RATE=15360
    -Ilib/edge-impulse-sdk
    -Ilib/edge-impulse-sdk/model-parameters
    -Ilib/edge-impulse-sdk/edge-impulse-sdk
    -Ilib/edge-impulse-sdk/tflite-model
    -Ilib/edge-impulse-sdk/edge-impulse-sdk/third_party/flatbuffers/include
    -Ilib/edge-impulse-sdk/edge-impulse-sdk/third_party/gemmlowp
    -Ilib/edge-impulse-sdk/edge-impulse-sdk/third_party/ruy
    -Ilib/edge-impulse-sdk/edge-impulse-sdk/porting/espressif/ESP-NN/include

; Host-side unit tests for the pure DSP library (lib/audio_dsp). No hardware needed.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
lib_ignore = edge-impulse-sdk
