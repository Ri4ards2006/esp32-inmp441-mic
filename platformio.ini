; PlatformIO Project Configuration File
; ESP32-WROOM-32D + INMP441 I2S Digital MEMS Microphone

[platformio]
default_envs = esp32dev
description = Modular ESP32 I2S audio acquisition firmware for INMP441 MEMS microphone

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Settings
monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder
    default
    time

; Upload Settings
upload_speed = 921600

; Build Options
build_flags = 
    -DCORE_DEBUG_LEVEL=3          ; 0: None, 1: Error, 2: Warn, 3: Info, 4: Debug, 5: Verbose
    -O2                           ; Optimization level for audio DSP
